<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="caraka — send the task, Caraka runs it">
<title>caraka — send the task, Caraka runs it</title>
<defs>
  <radialGradient id="bloom" cx="50%" cy="38%" r="50%">
    <stop offset="0%" stop-color="#E2452C" stop-opacity=".22"/>
    <stop offset="62%" stop-color="#E2452C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#E2452C"/><stop offset="100%" stop-color="#FF7A5E"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/><stop offset="22%" stop-color="#000"/>
    <stop offset="78%" stop-color="#000"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0v34" fill="none" stroke="#E2452C" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <radialGradient id="gmaskg" cx="50%" cy="42%" r="52%">
    <stop offset="12%" stop-color="#fff"/><stop offset="78%" stop-color="#000"/>
  </radialGradient>
  <mask id="gmask"><rect width="1280" height="440" fill="url(#gmaskg)"/></mask>
  <mask id="hmask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
</defs>

<rect width="1280" height="440" fill="#05080C"/>

<g mask="url(#gmask)">
  <rect x="-34" y="-34" width="1348" height="508" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;34 34" dur="12s" repeatCount="indefinite"/>
  </rect>
</g>

<ellipse cx="640" cy="168" rx="420" ry="230" fill="url(#bloom)" opacity=".82">
  <animate attributeName="opacity" values=".62;1;.62" dur="7s" repeatCount="indefinite"/>
</ellipse>

<g transform="translate(640 164)">
  <g opacity="1">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values=".72;1" keyTimes="0;1" calcMode="spline" keySplines=".2 .9 .3 1" dur="1.1s" begin=".55s" fill="freeze"/>
    <circle r="86" fill="none" stroke="#E2452C" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="1.6 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="70" fill="none" stroke="#E2452C" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="86 134">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="56" fill="none" stroke="#E2452C" stroke-opacity=".2" stroke-width="1" stroke-dasharray="4 7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-34" r="34" fill="none" stroke="#E2452C" stroke-opacity=".26" stroke-width="2"/>
    <circle cx="34" r="34" fill="none" stroke="#E2452C" stroke-opacity=".26" stroke-width="2"/>
    <circle cx="-34" r="34" fill="none" stroke="#FF7A5E" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="42 171.6" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;-213.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="34" r="34" fill="none" stroke="#FFEDE7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="42 171.6" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;213.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#FF7A5E"/>
  </g>
</g>

<g opacity="1">
  <animate attributeName="opacity" values="0;1" dur=".9s" begin=".95s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 14;0 0" keyTimes="0;1" calcMode="spline" keySplines=".2 .9 .3 1" dur=".9s" begin=".95s" fill="freeze"/>
  <text x="640" y="300" text-anchor="middle" fill="#F6F9FC" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="56" font-weight="500" letter-spacing="19" dx="9.5">caraka</text>
</g>

<g opacity="1">
  <animate attributeName="opacity" values="0;1" dur=".9s" begin="1.08s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 14;0 0" keyTimes="0;1" calcMode="spline" keySplines=".2 .9 .3 1" dur=".9s" begin="1.08s" fill="freeze"/>
  <text x="640" y="344" text-anchor="middle" fill="#E9EDF2" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">Send the task. <tspan fill="#FF7A5E">Caraka runs it.</tspan></text>
</g>

<g opacity="1">
  <animate attributeName="opacity" values="0;1" dur=".9s" begin="1.24s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 14;0 0" keyTimes="0;1" calcMode="spline" keySplines=".2 .9 .3 1" dur=".9s" begin="1.24s" fill="freeze"/>
  <text x="640" y="378" text-anchor="middle" fill="#7A848F" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">Telegram, and the coding agent already installed on your machine.</text>
</g>

<g opacity="1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.2" fill="#5D666F">
  <animate attributeName="opacity" values="0;1" dur=".9s" begin="1.4s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 14;0 0" keyTimes="0;1" calcMode="spline" keySplines=".2 .9 .3 1" dur=".9s" begin="1.4s" fill="freeze"/>
  <text x="640" y="418" text-anchor="middle">MIT<tspan fill="#232930" dx="14">/</tspan><tspan dx="14">NODE &#8805; 22</tspan><tspan fill="#232930" dx="14">/</tspan><tspan dx="14">28+ AGENTS VIA ACP</tspan><tspan fill="#232930" dx="14">/</tspan><tspan dx="14" fill="#FFD67E">PRE-ALPHA</tspan></text>
</g>

<rect y="0" width="1280" height="3" fill="#12161B"/>
<rect y="0" width="1280" height="3" fill="url(#rail)">
  <animate attributeName="width" values="0;1280" keyTimes="0;1" calcMode="spline" keySplines=".3 .7 .3 1" dur="1.6s" begin=".3s" fill="freeze"/>
</rect>
<g mask="url(#hmask)"><rect y="437" width="1280" height="1" fill="#1B2128"/></g>

<rect x="0" y="0" width="640" height="440" fill="#05080C" transform="translate(-660 0)">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-660 0" keyTimes="0;.1;1" calcMode="spline" keySplines="0 0 1 1;.7 0 .2 1" dur="1.1s" fill="freeze"/>
</rect>
<rect x="640" y="0" width="640" height="440" fill="#05080C" transform="translate(660 0)">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;660 0" keyTimes="0;.1;1" calcMode="spline" keySplines="0 0 1 1;.7 0 .2 1" dur="1.1s" fill="freeze"/>
</rect>
<rect x="638.5" y="0" width="3" height="440" fill="#FFF3F0" opacity="0">
  <animate attributeName="opacity" values="1;.35;0" keyTimes="0;.7;1" dur="1.1s" fill="freeze"/>
</rect>
</svg>
