  <path d="M856 214h-72" stroke="#1E3524" stroke-width="1.5" fill="none" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1.1s" repeatCount="indefinite"/></path>
