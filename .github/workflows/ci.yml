# The verification gate from `standards/ears.md`, run on every push and pull
# request. That gate covers `site/` as well as the root package, so both are
# here. Two commands are not: a live smoke needs an agent binary and the
# account behind it, and the site's Playwright suite needs Chromium, Firefox,
# and WebKit. Both stay per-machine commands (`npm run smoke`, `npm run e2e`
# inside `site/`) rather than a green light this workflow could fake. The
# `presets` job below carries the per-agent reasons. What CI verifies is the
# rest: the root gate commands, the site's lint, typecheck, and unit run, the
# schema and declared route over every shipped preset, the parser fixtures
# recorded in `test/fixtures/`, and `npm audit` over both trees a user can end
# up with.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # First, because a credential that reaches a public repository is not
      # undone by the four commands after it passing.
      - run: npm run scan:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # lint, astro check, and vitest. `pretest` regenerates the favicons and
      # the OG images first, so the glyph test reads what a build would draw
      # rather than whatever was committed.
      - run: npm run check

  # Every shipped preset, as far as a runner can take one. What a runner cannot
  # do is let any of them answer, and the seven fail that in three separate
  # ways. The live smoke stays `node scripts/smoke-cli.mjs <id>` on a machine
  # that has the agent, and this is the standing list of why it is not here:
  #
  #   claude-code, codex,  signed-in developer accounts. All three were proved
  #   goose                that way, on 7 and 10 August 2026 — goose reaches a
  #                        model through whatever `GOOSE_PROVIDER` names, and
  #                        the run that passed named `claude-code`. Putting any
  #                        of those accounts in a public repository's secrets
  #                        hands a paid seat to every fork, and to every pull
  #                        request that edits the workflow.
  #   aider                no account needed: it passed on 10 August 2026
  #                        against a model on the machine. A runner has no
  #                        model, and the smallest useful one is a
  #                        multi-gigabyte pull per job for two turns of work.
  #                        The no-account path is what goose could not show —
  #                        with `GOOSE_PROVIDER=ollama` and a local 7B it
  #                        finished the handshake and the first turn, then
  #                        failed to recall the number.
  #   gemini               a Google login, a Gemini API key, or Vertex AI. The
  #                        ACP handshake was proved without one; the turn needs
  #                        one.
  #   cursor, amp          a Cursor login and an Amp API key, both from paid
  #                        accounts. Same handshake, same wall.
  #
  # So this job stops where honesty does: the loader, the schema, the route
  # every preset declares, and the parsers, against files rather than agents.
  presets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every file in presets/agents/ through the real loader and Zod schema.
      # The loader collects invalid files instead of throwing, so the step
      # fails on the collected list, and a count mismatch catches a file the
      # loader never saw (a duplicated id overwrites its twin in the map).
      #
      # Then the one thing the schema cannot say: `command` and `acp` are both
      # optional there, because `claude-code` carries both routes and a `mcp`
      # preset will carry neither. A preset still has to name something for the
      # route it declares, or `scripts/smoke-cli.mjs` and the gateway both
      # reach it and find nothing to spawn.
      - name: validate presets against the schema and their declared route
        run: |
          node --import tsx --input-type=module -e '
            import { readdir } from "node:fs/promises";
            import { loadPresets } from "./src/drivers/preset.ts";
            const files = (await readdir("presets/agents")).filter((f) => /\.ya?ml$/.test(f));
            const { presets, errors } = await loadPresets();
            for (const error of errors) console.error(error);
            if (errors.length > 0) process.exit(1);
            if (presets.size !== files.length) {
              console.error(`${files.length} preset files, ${presets.size} loaded ids`);
              process.exit(1);
            }
            let broken = 0;
            for (const [id, preset] of presets) {
              const spawns = preset.driver === "acp" ? preset.acp?.command : preset.command;
              if (spawns) continue;
              console.error(`preset ${id} declares driver ${preset.driver} and names no command for it`);
              broken += 1;
            }
            if (broken > 0) process.exit(1);
            console.log(`${presets.size} presets valid: ${[...presets.keys()].join(", ")}`);
          '
      # The recorded output fixtures against the three parsers — the part of a
      # preset's contract that runs without any agent binary.
      - name: run the parser and preset fixtures
        run: node --import tsx --test --test-name-pattern "preset|parsers" test/unit.test.ts

  # `docs/security.md` §13 deferred the audit row because nothing repeated the
  # command and the audited tree never held Baileys (§3). Both trees a user can
  # end up with are audited here, so an advisory lands on a pull request rather
  # than on whoever reads the table next.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # What `npm i caraka` installs. `npm audit` resolves from the lockfile,
      # so this needs no `npm ci` in front of it.
      - name: audit the production tree
        run: npm audit --omit=dev --audit-level=high
      # What an install that chose the `baileys` WhatsApp provider installs.
      # npm refuses to add a package it already lists as an optional peer, so
      # the two peer fields come out first; the runner's checkout is thrown
      # away either way. The version is read from the pin rather than written
      # here, so a bump moves this step with it. A failure is a real advisory
      # in the version this package pins, not a flaky step.
      #
      # This step blocked nothing while the pin sat at 6.7.18, which the
      # maintainer had deprecated over GHSA-qvv5-jq5g-4cgg. The pin moved to
      # 6.7.22 on 8 August 2026 and the tree answers zero, so the step gates
      # again — which is the only state in which a green check means anything.
      - name: audit the production tree with the optional Baileys peer
        run: |
          version=$(node -p "require('./package.json').peerDependencies['@whiskeysockets/baileys']")
          npm pkg delete peerDependencies peerDependenciesMeta
          npm install --omit=dev --no-audit --no-fund --ignore-scripts \
            "@whiskeysockets/baileys@$version"
          npm audit --omit=dev --audit-level=high
