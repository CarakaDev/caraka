# The verification gate from `standards/ears.md`, run on every push and pull
# request. That gate covers `site/` as well as the root package, so both are
# here. Two commands are not: a live smoke against claude/codex/gemini needs
# the binary and its credentials, and the site's Playwright suite needs
# Chromium, Firefox, and WebKit. Both stay per-machine commands (`npm run
# smoke`, `npm run e2e` inside `site/`) rather than a green light this
# workflow could fake. What CI verifies is the rest: the root gate commands,
# the site's lint, typecheck, and unit run, the schema over every shipped
# preset, the parser fixtures recorded in `test/fixtures/`, and `npm audit`
# over both trees a user can end up with.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # lint, astro check, and vitest. `pretest` regenerates the favicons and
      # the OG images first, so the glyph test reads what a build would draw
      # rather than whatever was committed.
      - run: npm run check

  presets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every file in presets/agents/ through the real loader and Zod schema.
      # The loader collects invalid files instead of throwing, so the step
      # fails on the collected list, and a count mismatch catches a file the
      # loader never saw (a duplicated id overwrites its twin in the map).
      - name: validate presets against the schema
        run: |
          node --import tsx --input-type=module -e '
            import { readdir } from "node:fs/promises";
            import { loadPresets } from "./src/drivers/preset.ts";
            const files = (await readdir("presets/agents")).filter((f) => /\.ya?ml$/.test(f));
            const { presets, errors } = await loadPresets();
            for (const error of errors) console.error(error);
            if (errors.length > 0) process.exit(1);
            if (presets.size !== files.length) {
              console.error(`${files.length} preset files, ${presets.size} loaded ids`);
              process.exit(1);
            }
            console.log(`${presets.size} presets valid: ${[...presets.keys()].join(", ")}`);
          '
      # The recorded output fixtures against the three parsers — the part of a
      # preset's contract that runs without any agent binary.
      - name: run the parser and preset fixtures
        run: node --import tsx --test --test-name-pattern "preset|parsers" test/unit.test.ts

  # `docs/security.md` §13 deferred the audit row because nothing repeated the
  # command and the audited tree never held Baileys (§3). Both trees a user can
  # end up with are audited here, so an advisory lands on a pull request rather
  # than on whoever reads the table next.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # What `npm i caraka` installs. `npm audit` resolves from the lockfile,
      # so this needs no `npm ci` in front of it.
      - name: audit the production tree
        run: npm audit --omit=dev --audit-level=high
      # What an install that chose the `baileys` WhatsApp provider installs.
      # npm refuses to add a package it already lists as an optional peer, so
      # the two peer fields come out first; the runner's checkout is thrown
      # away either way. The version is read from the pin rather than written
      # here, so a bump moves this step with it. A failure is a real advisory
      # in the version this package pins, not a flaky step.
      #
      # It is also a failure nobody's pull request can fix today: the row in
      # `docs/security.md` §13 records that `@whiskeysockets/baileys@6.7.18` is
      # itself under GHSA-qvv5-jq5g-4cgg and that this step exited 1 on 8
      # August 2026. Gating every push on it would teach people to ignore a red
      # check, so the step reports and does not block until the pin can move
      # past the advisory — at which point this line comes off with the §13 row.
      - name: audit the production tree with the optional Baileys peer
        continue-on-error: true
        run: |
          version=$(node -p "require('./package.json').peerDependencies['@whiskeysockets/baileys']")
          npm pkg delete peerDependencies peerDependenciesMeta
          npm install --omit=dev --no-audit --no-fund --ignore-scripts \
            "@whiskeysockets/baileys@$version"
          npm audit --omit=dev --audit-level=high
