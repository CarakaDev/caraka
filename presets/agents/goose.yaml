# Goose (Block). ACP native per matriks riset baris 13.
#
# Diverifikasi terhadap goose 1.45.0 pada 10 Agustus 2026 lewat
# `scripts/smoke-cli.mjs goose`: dua giliran dan satu `session/load` di
# antaranya, giliran kedua menyebut angka giliran pertama. Tidak ada yang
# berubah di berkas ini — `goose acp` ("Run goose as an ACP agent server on
# stdio") ada persis seperti yang ditulis dokumentasinya.
#
# Goose memilih modelnya sendiri lewat `GOOSE_PROVIDER`/`GOOSE_MODEL` milik
# mesin, jadi preset tidak menyebut satu pun. Run yang lulus memakai provider
# `claude-code`; provider `ollama` dengan model 7B lokal menyelesaikan
# handshake dan giliran pertama, lalu gagal mengingat angkanya — batas
# modelnya, bukan batas preset ini.
#
# `asksPermission` sengaja dibiarkan kosong: giliran smoke melarang pemakaian
# tool, jadi tidak ada yang pernah melihat Goose mengirim
# `session/request_permission`, dan run read-only menolak rute yang belum
# terlihat bertanya.
id: goose
driver: acp
acp:
  command: goose
  args: ["acp"]
