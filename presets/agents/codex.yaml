# Codex CLI (OpenAI). Dari docs/api.md §1, dipangkas ke field yang dibaca kode.
# The sandbox is the security control (docs/security.md §7). It follows the
# conversation's policy mode through `{sandbox}` and the `sandbox` map below:
# `read-only` stays read-only, and `assisted` or `trusted` let Codex write
# inside the workspace. A conversation with no configured mode stays read-only.
# Do not write a fixed value into `args` or `resumeArgs`: that breaks the map.
#
# Baris `resumeArgs` dulu menyalin bentuk `args` dan salah di dua tempat, dan
# smoke hidup pertama terhadap codex-cli 0.147.0 pada 10 Agustus 2026 yang
# menemukannya: `codex exec resume` tidak menerima `--color` (ia berhenti dengan
# "unexpected argument") dan tidak menerima `--sandbox` sama sekali. Yang kedua
# yang berbahaya — giliran lanjutan berjalan tanpa sandbox yang diminta baris
# pertama berkas ini. Resume menerima `-c <kunci>=<nilai>`, dan `sandbox_mode`
# divalidasi terhadap tiga nilai yang sama dengan `--sandbox`: memberinya nilai
# asal ditolak sebelum model dipanggil, jadi kontrolnya benar-benar tegak dan
# bukan sekadar diterima.
id: codex
driver: cli
command: codex
args: ["exec", "--json", "--color", "never", "--sandbox", "{sandbox}", "--skip-git-repo-check"]
resumeArgs: ["exec", "resume", "{sessionId}", "--json", "--skip-git-repo-check", "-c", "sandbox_mode=\"{sandbox}\""]
sandbox:
  read-only: read-only
  assisted: workspace-write
  trusted: workspace-write
output: jsonl
resumeOutput: jsonl
sessionIdFields: ["thread_id", "session_id"]
# openai/codex#2085: codex tidak membaca gambar dari path yang ditulis di dalam
# prompt, ia butuh `--image/-i`. Flag itu boleh diulang, jadi `repeat`.
imageArg: "-i"
imageMode: repeat
